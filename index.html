<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أشجار الأنساب</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f1e6; color: #21342c; font: 1rem/1.8 Tahoma, sans-serif; }
    main { max-width: 55rem; margin: auto; padding: clamp(2rem, 8vw, 6rem) 1.25rem; }
    header { border-top: 4px solid #a98039; padding-block: 1.25rem; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); }
    p { margin: .4rem 0; }
    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      gap: 1rem;
    }
    a { color: #255844; }
    a:focus-visible { outline: 3px solid #795717; outline-offset: 4px; }
    .choice {
      display: block;
      padding: 1.5rem;
      border: 1px solid #d4c5a8;
      border-radius: .8rem;
      background: #fffcf5;
      text-decoration: none;
    }
    .choice:hover { border-color: #255844; background: #fff; }
    .choice strong { display: block; font-size: 1.35rem; }
    .choice span { display: block; color: #48574f; }
    .back { display: inline-block; margin-bottom: 1rem; }
    #bani-hajer { display: none; }
    #bani-hajer:target { display: block; }
    #bani-hajer:target + #home { display: none; }
  </style>
</head>
<body>
  <main>
    <section id="bani-hajer" aria-labelledby="bani-title">
      <a class="back" href="#home">العودة إلى الرئيسية</a>
      <header>
        <h1 id="bani-title">شجرة بني هاجر</h1>
        <p>ستُعرض هنا الشجرة العامة بعد إضافة بياناتها.</p>
      </header>
    </section>
    <section id="home" aria-labelledby="home-title">
      <header>
        <h1 id="home-title">أشجار الأنساب</h1>
        <p>اختر الشجرة التي تريد عرضها.</p>
      </header>
      <nav aria-label="اختيار الشجرة">
        <a class="choice" href="#bani-hajer">
          <strong>شجرة بني هاجر</strong>
          <span>الشجرة العامة للقبيلة</span>
        </a>
        <a class="choice" href="https://script.google.com/macros/s/AKfycbwxRv7OGHTpQhJD5hU1m0NkJVpEPqMVuguEmar5QBLfNUYqfFzqOxITv2mcCYUaESA/exec?tree=al-tawah">
          <strong>شجرة آل تواه</strong>
          <span>الشجرة العائلية الخاصة</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
